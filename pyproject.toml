[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-asr-lite"
version = "1.0.0"
description = "零第三方依赖、可插拔多引擎并发调度语音转文字与豆包 LLM 无锁分桶流式整理框架（内置搜狗 14 语种/方言极速 ASR 引擎，原生支持 Python 3.15t GIL=False）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Omni ASR Lite Authors" }]
# 零第三方 Python 包依赖（仅使用 Python 标准库 + 内置 opus.dll）
dependencies = []

[project.scripts]
omni-asr-lite = "omni_asr_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omni_asr_lite = ["_bin/*.dll", "_bin/*.so*", "_bin/*.dylib"]
